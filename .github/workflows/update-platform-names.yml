name: Update Jotego platform names

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-platform-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Jotego platform names from dyreschlock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/update_platform_names.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain platform_names.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add platform_names.json
            git commit -m "chore: sync new Jotego platform names"
            git push
          else
            echo "platform_names.json unchanged."
          fi
